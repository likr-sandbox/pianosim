name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Node dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check source line limits and clean-room rules
        run: cargo run -p piano-cli -- check-lines

      - name: Run Clippy across workspace
        run: cargo clippy --workspace -- -D warnings

      - name: Run Clippy on Wasm target
        run: cargo clippy --package piano-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --workspace

      - name: Build Wasm and Web bundle
        run: npm run build

      - name: Verify Wasm SIMD128 instructions
        run: cargo run -p piano-cli -- check-wasm-simd apps/web/public/piano_wasm.wasm

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
