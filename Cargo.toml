[workspace]
resolver = "2"
members = [
    "crates/piano-simd",
    "crates/piano-spec",
    "crates/piano-action",
    "crates/piano-strings",
    "crates/piano-bridge",
    "crates/piano-body-gen",
    "crates/piano-radiator",
    "crates/piano-engine",
    "crates/piano-wasm",
    "crates/piano-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
